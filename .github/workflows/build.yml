name: Build EPIC Social Media APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Create Android project
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          mkdir -p app/src/main/java/com/epic/social
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "EPIC"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.epic.social'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.epic.social'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1877F2</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>

              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="false"
                  android:label="EPIC"
                  android:theme="@style/AppTheme"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/epic/social/MainActivity.java <<'EOF'
          package com.epic.social;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  webView.setBackgroundColor(0xFFFFFFFF);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF

          cat > app/src/main/assets/config.json <<EOF
          {
            "supabaseUrl": "${SUPABASE_URL}",
            "supabaseKey": "${SUPABASE_PUBLISHABLE_KEY}"
          }
          EOF

          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
          <meta name="theme-color" content="#ffffff">
          <title>EPIC</title>

          <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

          <style>
          :root {
            --blue: #1877f2;
            --blue-dark: #0866ff;
            --background: #f0f2f5;
            --white: #ffffff;
            --text: #1c1e21;
            --muted: #65676b;
            --border: #e4e6eb;
            --green: #31a24c;
          }

          * { box-sizing: border-box; }

          body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--background);
            color: var(--text);
          }

          button, input, textarea, select { font: inherit; }
          button { cursor: pointer; }
          .hidden { display: none !important; }

          .topbar {
            height: 58px;
            background: var(--white);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 20;
          }

          .logo {
            color: var(--blue);
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -1.5px;
          }

          .top-actions { display: flex; gap: 8px; }

          .round-button {
            width: 40px;
            height: 40px;
            border: 0;
            border-radius: 50%;
            background: #e4e6eb;
            font-size: 20px;
            color: var(--text);
          }

          .tabs {
            display: flex;
            justify-content: space-around;
            gap: 2px;
            background: white;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 58px;
            z-index: 19;
          }

          .tab {
            border: 0;
            background: transparent;
            color: var(--muted);
            flex: 1;
            min-width: 0;
            height: 48px;
            font-size: 21px;
            border-bottom: 3px solid transparent;
          }

          .tab.active { color: var(--blue); border-bottom-color: var(--blue); }

          .page {
            display: none;
            max-width: 720px;
            margin: 0 auto;
            padding: 12px;
          }

          .page.active { display: block; }

          .card {
            background: white;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 1px 2px #0000000d;
          }

          .auth-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
          }

          .auth-card {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 5px 24px #00000012;
          }

          .auth-logo {
            text-align: center;
            font-size: 46px;
            font-weight: 900;
            color: var(--blue);
            margin-bottom: 4px;
          }

          .subtitle {
            color: var(--muted);
            text-align: center;
            line-height: 1.4;
            margin-bottom: 22px;
          }

          .field {
            width: 100%;
            border: 1px solid #ccd0d5;
            border-radius: 9px;
            padding: 13px;
            margin: 6px 0;
            background: white;
            outline-color: var(--blue);
          }

          .primary {
            width: 100%;
            border: 0;
            background: var(--blue);
            color: white;
            border-radius: 9px;
            padding: 13px;
            font-weight: 700;
            margin-top: 8px;
          }

          .secondary {
            border: 0;
            background: #e7f3ff;
            color: var(--blue);
            padding: 10px 13px;
            border-radius: 8px;
            font-weight: 700;
          }

          .text-button {
            border: 0;
            background: transparent;
            color: var(--blue);
            padding: 12px 4px;
            font-weight: 700;
          }

          .divider { height: 1px; background: var(--border); margin: 15px 0; }
          .row { display: flex; align-items: center; gap: 10px; }
          .spread { justify-content: space-between; }

          .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #dbeafe;
            color: var(--blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            flex-shrink: 0;
            overflow: hidden;
          }

          .avatar img { width: 100%; height: 100%; object-fit: cover; }
          .muted { color: var(--muted); font-size: 13px; }

          .post-content {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.45;
            margin: 12px 0;
          }

          .post-image {
            width: 100%;
            max-height: 500px;
            object-fit: contain;
            border-radius: 8px;
            background: #f0f2f5;
          }

          .post-actions { display: flex; gap: 5px; margin-top: 10px; }

          .post-actions button {
            flex: 1;
            border: 0;
            background: transparent;
            padding: 10px 3px;
            color: var(--muted);
            border-radius: 7px;
          }

          .post-actions button:active { background: #e4e6eb; }
          .post-actions .liked { color: var(--blue); font-weight: 700; }
          .section-title { font-size: 21px; margin: 8px 0 14px; }
          .reels-page { padding: 0; max-width: 600px; }
          .reel-form { margin: 12px; }
          .reels-feed { width: 100%; }

          .reel-card {
            position: relative;
            height: min(76vh, 740px);
            min-height: 420px;
            margin: 10px 0;
            background: #080808;
            border-radius: 12px;
            overflow: hidden;
            color: white;
            isolation: isolate;
          }

          .reel-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #080808;
            display: block;
          }

          .reel-top-gradient {
            position: absolute;
            inset: 0 0 auto;
            height: 120px;
            background: linear-gradient(#0009, transparent);
            pointer-events: none;
          }

          .reel-bottom-gradient {
            position: absolute;
            inset: auto 0 0;
            height: 230px;
            background: linear-gradient(transparent, #000d);
            pointer-events: none;
          }

          .reel-user {
            position: absolute;
            bottom: 72px;
            left: 14px;
            right: 74px;
            z-index: 2;
          }

          .reel-username { font-size: 15px; font-weight: 800; margin-bottom: 8px; }
          .reel-caption { font-size: 14px; line-height: 1.4; overflow-wrap: anywhere; }

          .reel-side-actions {
            position: absolute;
            right: 12px;
            bottom: 78px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            align-items: center;
            z-index: 3;
          }

          .reel-action {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: white;
            border: 0;
            background: transparent;
            font-size: 22px;
            text-shadow: 0 1px 4px #000;
          }

          .reel-action small { font-size: 11px; }

          .reel-play {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 0;
            background: #0006;
            color: white;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            font-size: 25px;
            z-index: 3;
          }

          .reel-sound {
            position: absolute;
            right: 12px;
            top: 12px;
            z-index: 3;
            border: 0;
            color: white;
            background: #0008;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 18px;
          }

          .reel-empty {
            margin: 12px;
            background: white;
            padding: 24px 16px;
            text-align: center;
            border-radius: 12px;
            color: var(--muted);
          }

          .list-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
          }

          .list-item:last-child { border-bottom: 0; }
          .item-body { flex: 1; min-width: 0; }
          .item-body p { margin: 5px 0; overflow-wrap: anywhere; }

          .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
          }

          .menu-tile {
            padding: 18px 8px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: white;
            text-align: center;
            font-weight: 700;
          }

          .status-message {
            margin: 10px 0;
            padding: 10px;
            background: #e7f3ff;
            color: #084298;
            border-radius: 8px;
            overflow-wrap: anywhere;
          }

          .danger { background: #ffe8e8; color: #b42318; }
          .comment-box { border-top: 1px solid var(--border); margin-top: 8px; padding-top: 8px; }
          .comment { padding: 7px 0; font-size: 14px; }
          .small-button { border: 0; background: #e4e6eb; border-radius: 7px; padding: 8px 10px; }
          .video-preview { width: 100%; max-height: 220px; background: #000; border-radius: 8px; margin-top: 8px; }

          @media (max-width: 420px) {
            .page { padding: 8px; }
            .reels-page { padding: 0; }
            .reel-card { border-radius: 0; margin: 8px 0; height: 72vh; min-height: 390px; }
            .logo { font-size: 27px; }
            .tab { font-size: 19px; }
          }
          </style>
          </head>

          <body>
          <div id="authScreen" class="auth-wrap">
            <div class="auth-card">
              <div class="auth-logo">epic</div>
              <div class="subtitle">Connect with friends and the world around you.</div>
              <div id="authMessage" class="status-message hidden"></div>

              <form id="loginForm">
                <input id="loginEmail" class="field" type="email" placeholder="Email address" autocomplete="email" required>
                <input id="loginPassword" class="field" type="password" placeholder="Password" autocomplete="current-password" required>
                <button class="primary" type="submit">Log in</button>
              </form>

              <div class="divider"></div>
              <button id="showRegister" class="primary" style="background:#42b72a">Create new account</button>

              <form id="registerForm" class="hidden">
                <input id="registerName" class="field" placeholder="Full name" maxlength="80" required>
                <input id="registerUsername" class="field" placeholder="Username" maxlength="30" required>
                <input id="registerEmail" class="field" type="email" placeholder="Email address" autocomplete="email" required>
                <input id="registerPassword" class="field" type="password" placeholder="Password (at least 8 characters)" minlength="8" autocomplete="new-password" required>
                <button class="primary" type="submit">Create account</button>
                <button id="showLogin" class="text-button" type="button">Already have an account? Log in</button>
              </form>
            </div>
          </div>

          <div id="appScreen" class="hidden">
            <header class="topbar">
              <div class="logo">epic</div>
              <div class="top-actions">
                <button id="searchButton" class="round-button" aria-label="Search">⌕</button>
                <button id="createButton" class="round-button" aria-label="Create post">＋</button>
                <button id="menuButton" class="round-button" aria-label="Menu">☰</button>
              </div>
            </header>

            <nav class="tabs">
              <button class="tab active" data-page="home" aria-label="Home">⌂</button>
              <button class="tab" data-page="friends" aria-label="Friends">♧</button>
              <button class="tab" data-page="messenger" aria-label="Messenger">☏</button>
              <button class="tab" data-page="reels" aria-label="Reels">▶</button>
              <button class="tab" data-page="notifications" aria-label="Notifications">♧</button>
              <button class="tab" data-page="marketplace" aria-label="Marketplace">▦</button>
            </nav>

            <main>
              <section id="page-home" class="page active">
                <div class="card">
                  <div class="row">
                    <div id="myAvatar" class="avatar">E</div>
                    <button id="openPostComposer" class="field" style="text-align:left;margin:0;border-radius:24px">What's on your mind?</button>
                  </div>
                  <div class="divider"></div>
                  <div class="row spread">
                    <button id="quickPhoto" class="text-button">▧ Photo / video</button>
                    <button id="quickReel" class="text-button">▶ Create reel</button>
                  </div>
                </div>

                <div id="postComposer" class="card hidden">
                  <h3>Create post</h3>
                  <textarea id="postText" class="field" rows="4" placeholder="What's on your mind?"></textarea>
                  <input id="postImageUrl" class="field" type="url" placeholder="Image URL (optional)">
                  <button id="publishPost" class="primary">Post</button>
                  <button id="cancelPost" class="text-button">Cancel</button>
                </div>

                <div id="feedMessage" class="status-message hidden"></div>
                <div id="feed"></div>
              </section>

              <section id="page-friends" class="page">
                <h2 class="section-title">Friends</h2>
                <div class="card">
                  <input id="friendSearch" class="field" placeholder="Find people by username or name">
                  <button id="findFriends" class="primary">Search people</button>
                </div>
                <div id="friendResults" class="card"></div>
                <h3>Friend requests</h3>
                <div id="friendRequests" class="card"></div>
                <h3>Friends list</h3>
                <div id="friendsList" class="card"></div>
              </section>

              <section id="page-messenger" class="page">
                <h2 class="section-title">Messenger</h2>
                <div class="card">
                  <input id="messageRecipient" class="field" placeholder="Recipient's username">
                  <button id="startConversation" class="primary">Open conversation</button>
                </div>
                <div id="conversation" class="card">
                  <p class="muted">Search for a username to start a conversation.</p>
                </div>
              </section>

              <section id="page-reels" class="page reels-page">
                <div class="card reel-form">
                  <h2 style="margin-top:0">Reels</h2>
                  <p class="muted">Share a video using a direct, publicly accessible MP4 or WebM URL.</p>
                  <input id="videoUrl" class="field" type="url" placeholder="Direct video URL (.mp4 or .webm)">
                  <input id="videoCaption" class="field" maxlength="500" placeholder="Write a caption">
                  <button id="publishVideo" class="primary">Publish reel</button>
                  <div id="reelMessage" class="status-message hidden"></div>
                </div>
                <div id="videos" class="reels-feed"></div>
              </section>

              <section id="page-notifications" class="page">
                <h2 class="section-title">Notifications</h2>
                <div id="notificationsList" class="card"></div>
              </section>

              <section id="page-marketplace" class="page">
                <h2 class="section-title">Marketplace</h2>
                <div class="card">
                  <h3>Create a listing</h3>
                  <input id="marketTitle" class="field" placeholder="Item name" maxlength="120">
                  <input id="marketPrice" class="field" type="number" min="0" step="0.01" placeholder="Price">
                  <input id="marketImage" class="field" type="url" placeholder="Image URL (optional)">
                  <textarea id="marketDescription" class="field" rows="3" placeholder="Description"></textarea>
                  <button id="publishListing" class="primary">Publish listing</button>
                  <div id="marketMessage" class="status-message hidden"></div>
                </div>
                <div id="marketListings"></div>
              </section>

              <section id="page-profile" class="page">
                <h2 class="section-title">Your profile</h2>
                <div class="card">
                  <input id="profileName" class="field" placeholder="Full name">
                  <input id="profileUsername" class="field" placeholder="Username">
                  <input id="profileAvatar" class="field" type="url" placeholder="Avatar image URL">
                  <textarea id="profileBio" class="field" rows="3" placeholder="Bio"></textarea>
                  <button id="saveProfile" class="primary">Save profile</button>
                  <div id="profileMessage" class="status-message hidden"></div>
                </div>
                <div class="card">
                  <button id="logoutButton" class="primary danger">Log out</button>
                </div>
              </section>

              <section id="page-menu" class="page">
                <h2 class="section-title">Menu</h2>
                <div class="card menu-grid">
                  <button class="menu-tile" data-goto="home">⌂<br>Home</button>
                  <button class="menu-tile" data-goto="friends">♧<br>Friends</button>
                  <button class="menu-tile" data-goto="messenger">☏<br>Messenger</button>
                  <button class="menu-tile" data-goto="reels">▶<br>Reels</button>
                  <button class="menu-tile" data-goto="notifications">♧<br>Notifications</button>
                  <button class="menu-tile" data-goto="marketplace">▦<br>Marketplace</button>
                  <button class="menu-tile" data-goto="profile">👤<br>Profile</button>
                </div>
                <div class="card">
                  <button id="menuLogout" class="primary danger">Log out</button>
                </div>
              </section>

              <section id="page-search" class="page">
                <h2 class="section-title">Search EPIC</h2>
                <div class="card">
                  <input id="globalSearch" class="field" placeholder="Search people">
                  <button id="globalSearchButton" class="primary">Search</button>
                </div>
                <div id="globalSearchResults" class="card"></div>
              </section>
            </main>
          </div>

          <script>
          let supabaseClient = null;
          let currentUser = null;
          let currentProfile = null;
          let activeConversationUser = null;
          let messagePollTimer = null;
          let reelObserver = null;

          const $ = id => document.getElementById(id);

          function showMessage(id, message, error = false) {
            const el = $(id);
            if (!el) return;
            el.textContent = message;
            el.classList.remove("hidden", "danger");
            if (error) el.classList.add("danger");
          }

          function hideMessage(id) {
            const el = $(id);
            if (el) el.classList.add("hidden");
          }

          function escapeHtml(value) {
            return String(value ?? "").replace(/[&<>"']/g, char => ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#039;"
            })[char]);
          }

          function safeUrl(value) {
            try {
              const url = new URL(value);
              if (url.protocol === "https:" || url.protocol === "http:") {
                return url.href;
              }
            } catch (_) {}
            return "";
          }

          function shortId(value) {
            return String(value || "").replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 80);
          }

          async function initialise() {
            try {
              const response = await fetch("config.json");
              const config = await response.json();

              if (!config.supabaseUrl || !config.supabaseKey) {
                throw new Error("Supabase configuration is missing. Check GitHub Secrets.");
              }

              if (!window.supabase) {
                throw new Error("Supabase library could not load. Check your internet connection.");
              }

              supabaseClient = window.supabase.createClient(config.supabaseUrl, config.supabaseKey);

              const { data, error } = await supabaseClient.auth.getSession();
              if (error) throw error;

              if (data.session) {
                currentUser = data.session.user;
                await enterApp();
              }
            } catch (error) {
              showMessage("authMessage", error.message || "Could not initialise EPIC.", true);
            }
          }

          function switchAuthForm(showRegister) {
            $("loginForm").classList.toggle("hidden", showRegister);
            $("registerForm").classList.toggle("hidden", !showRegister);
            hideMessage("authMessage");
          }

          $("showRegister").addEventListener("click", () => switchAuthForm(true));
          $("showLogin").addEventListener("click", () => switchAuthForm(false));

          $("registerForm").addEventListener("submit", async event => {
            event.preventDefault();
            if (!supabaseClient) return showMessage("authMessage", "App is still loading.", true);

            const fullName = $("registerName").value.trim();
            const username = $("registerUsername").value.trim().replace(/^@/, "");
            const email = $("registerEmail").value.trim();
            const password = $("registerPassword").value;

            if (!/^[a-zA-Z0-9_.]{3,30}$/.test(username)) {
              return showMessage("authMessage", "Username must be 3–30 letters, numbers, dots or underscores.", true);
            }

            showMessage("authMessage", "Creating your account…");

            try {
              const { data, error } = await supabaseClient.auth.signUp({
                email,
                password,
                options: { data: { full_name: fullName, username } }
              });

              if (error) throw error;

              if (data.session) {
                currentUser = data.user;
                await enterApp();
              } else {
                showMessage("authMessage", "Account created. Check your email to verify your account, then log in.");
                switchAuthForm(false);
              }
            } catch (error) {
              showMessage("authMessage", error.message || "Registration failed.", true);
            }
          });

          $("loginForm").addEventListener("submit", async event => {
            event.preventDefault();
            if (!supabaseClient) return showMessage("authMessage", "App is still loading.", true);

            showMessage("authMessage", "Logging in…");

            try {
              const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: $("loginEmail").value.trim(),
                password: $("loginPassword").value
              });

              if (error) throw error;
              currentUser = data.user;
              await enterApp();
            } catch (error) {
              showMessage("authMessage", error.message || "Login failed.", true);
            }
          });

          async function enterApp() {
            $("authScreen").classList.add("hidden");
            $("appScreen").classList.remove("hidden");
            await loadProfile();
            await loadFeed();
            await loadFriendRequests();
            await loadFriends();
            await loadNotifications();
            await loadMarketplace();
            showPage("home");
          }

          async function loadProfile() {
            if (!currentUser) return;

            try {
              const { data, error } = await supabaseClient
                .from("profiles").select("*").eq("id", currentUser.id).maybeSingle();

              if (error) throw error;
              currentProfile = data;

              if (!data) {
                const metadata = currentUser.user_metadata || {};
                const username = metadata.username || (currentUser.email || "user").split("@")[0];

                const { data: inserted, error: insertError } = await supabaseClient
                  .from("profiles")
                  .upsert({
                    id: currentUser.id,
                    username,
                    full_name: metadata.full_name || username
                  }, { onConflict: "id" })
                  .select().maybeSingle();

                if (!insertError) currentProfile = inserted;
              }

              $("profileName").value = currentProfile?.full_name || "";
              $("profileUsername").value = currentProfile?.username || "";
              $("profileAvatar").value = currentProfile?.avatar_url || "";
              $("profileBio").value = currentProfile?.bio || "";

              const avatar = $("myAvatar");
              const avatarUrl = safeUrl(currentProfile?.avatar_url || "");

              avatar.innerHTML = avatarUrl
                ? `<img src="${escapeHtml(avatarUrl)}" alt="Profile">`
                : escapeHtml((currentProfile?.full_name || "E").charAt(0).toUpperCase());
            } catch (error) {
              console.error("Profile load error:", error);
            }
          }

          $("saveProfile").addEventListener("click", async () => {
            if (!currentUser) return;

            const username = $("profileUsername").value.trim().replace(/^@/, "");
            if (!/^[a-zA-Z0-9_.]{3,30}$/.test(username)) {
              return showMessage("profileMessage", "Username must be 3–30 letters, numbers, dots or underscores.", true);
            }

            try {
              const updates = {
                id: currentUser.id,
                full_name: $("profileName").value.trim(),
                username,
                avatar_url: safeUrl($("profileAvatar").value.trim()) || null,
                bio: $("profileBio").value.trim()
              };

              const { data, error } = await supabaseClient
                .from("profiles").upsert(updates, { onConflict: "id" }).select().single();

              if (error) throw error;
              currentProfile = data;
              await loadProfile();
              showMessage("profileMessage", "Profile updated.");
            } catch (error) {
              showMessage("profileMessage", error.message || "Could not save profile.", true);
            }
          });

          function showPage(page) {
            document.querySelectorAll(".page").forEach(section => section.classList.remove("active"));
            document.querySelectorAll(".tab").forEach(tab => tab.classList.remove("active"));

            const target = $("page-" + page);
            if (target) target.classList.add("active");

            const tab = document.querySelector(`.tab[data-page="${page}"]`);
            if (tab) tab.classList.add("active");

            if (page === "home") loadFeed();
            if (page === "friends") {
              loadFriendRequests();
              loadFriends();
            }
            if (page === "notifications") loadNotifications();
            if (page === "marketplace") loadMarketplace();
            if (page === "reels") loadVideos();

            if (page !== "reels" && reelObserver) {
              reelObserver.disconnect();
              reelObserver = null;
              document.querySelectorAll(".reel-video").forEach(video => video.pause());
            }
          }

          document.querySelectorAll(".tab").forEach(tab => {
            tab.addEventListener("click", () => showPage(tab.dataset.page));
          });

