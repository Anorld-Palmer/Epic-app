name: Build EPIC Social App

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create EPIC project
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          mkdir -p app/src/main/java/com/epic/social
          mkdir -p app/src/main/assets

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "EPIC"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.epic.social'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.epic.social'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="EPIC"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/epic/social/MainActivity.java <<'EOF'
          package com.epic.social;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView web = new WebView(this);
                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);

                  web.setWebViewClient(new WebViewClient());
                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  setContentView(getWindow().getDecorView());
                  super.onBackPressed();
              }
          }
          EOF

          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>EPIC</title>
          <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
          <style>
          *{box-sizing:border-box}
          body{margin:0;font-family:Arial,sans-serif;background:#f0f2f5;color:#1c1e21}
          button,input,textarea{font:inherit}
          button{cursor:pointer;border:0;border-radius:8px;padding:11px;background:#e4e6eb;color:#1c1e21}
          input,textarea{width:100%;padding:12px;border:1px solid #dddfe2;border-radius:8px;margin:6px 0}
          .top{background:white;padding:12px 15px;position:sticky;top:0;z-index:5;border-bottom:1px solid #ddd}
          .brand{font-size:30px;font-weight:bold;color:#1877f2}
          .toprow{display:flex;justify-content:space-between;align-items:center;gap:10px}
          .round{width:40px;height:40px;border-radius:50%;font-size:19px}
          .tabs{display:flex;justify-content:space-around;background:white;border-bottom:1px solid #ddd;position:sticky;top:62px;z-index:4}
          .tab{flex:1;background:white;border-radius:0;padding:13px 2px;font-size:21px}
          .tab.active{color:#1877f2;border-bottom:3px solid #1877f2}
          .page{padding:12px;max-width:650px;margin:auto}
          .card{background:white;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px #00000012}
          .row{display:flex;align-items:center;gap:10px}
          .avatar{width:42px;height:42px;border-radius:50%;background:#dbeafe;color:#1877f2;display:flex;align-items:center;justify-content:center;font-weight:bold}
          .muted{color:#65676b;font-size:13px}
          .blue{background:#1877f2;color:white}
          .full{width:100%;margin-top:8px}
          .actions{display:flex;justify-content:space-around;border-top:1px solid #ddd;margin-top:12px;padding-top:10px;gap:5px}
          .actions button{flex:1;background:white}
          .stories{display:flex;gap:10px;overflow-x:auto}
          .story{min-width:95px;height:135px;border-radius:12px;background:#dbeafe;display:flex;align-items:end;justify-content:center;padding:8px;color:#164e9a;font-weight:bold}
          .hidden{display:none!important}
          .section-title{font-weight:bold;font-size:19px;margin:10px 0}
          .posttext{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:12px}
          .error{color:#b91c1c}
          </style>
          </head>
          <body>

          <div id="auth" class="page">
            <div class="card" style="margin-top:45px;text-align:center">
              <div class="brand">epic</div>
              <p>Your world. Your people.</p>
              <input id="email" type="email" placeholder="Email address">
              <input id="password" type="password" placeholder="Password">
              <input id="username" placeholder="Username (for registration)">
              <button class="blue full" onclick="login()">Log in</button>
              <button class="full" onclick="register()">Create new account</button>
              <p id="authmsg" class="muted"></p>
            </div>
          </div>

          <div id="app" class="hidden">
            <header class="top">
              <div class="toprow">
                <span class="brand">epic</span>
                <div class="row">
                  <button class="round" onclick="showPage('Create')">＋</button>
                  <button class="round" onclick="showPage('Search')">⌕</button>
                  <button class="round" onclick="showPage('Profile')">☰</button>
                </div>
              </div>
            </header>

            <nav class="tabs">
              <button class="tab active" data-page="Home" onclick="showPage('Home')">⌂</button>
              <button class="tab" data-page="Friends" onclick="showPage('Friends')">♧</button>
              <button class="tab" data-page="Messenger" onclick="showPage('Messenger')">☏</button>
              <button class="tab" data-page="Reels" onclick="showPage('Reels')">▶</button>
              <button class="tab" data-page="Notifications" onclick="showPage('Notifications')">♧</button>
              <button class="tab" data-page="Marketplace" onclick="showPage('Marketplace')">▣</button>
            </nav>

            <main id="content" class="page"></main>
          </div>

          <script>
          const SB_URL = "SUPABASE_URL_PLACEHOLDER";
          const SB_KEY = "SUPABASE_KEY_PLACEHOLDER";
          const db = window.supabase.createClient(SB_URL, SB_KEY);

          let currentUser = null;
          let currentPage = "Home";

          function message(id, text) {
            document.getElementById(id).textContent = text;
          }

          async function register() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const username = document.getElementById('username').value.trim();

            if (!email || !password || !username) {
              message('authmsg', 'Enter your email, password and username.');
              return;
            }

            const {data, error} = await db.auth.signUp({
              email, password,
              options: {data: {username}}
            });

            if (error) {
              message('authmsg', error.message);
              return;
            }

            if (data.session) {
              currentUser = data.user;
              await ensureProfile(username);
              openApp();
            } else {
              message('authmsg', 'Check your email for the confirmation link, then log in.');
            }
          }

          async function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            const {data, error} = await db.auth.signInWithPassword({email, password});

            if (error) {
              message('authmsg', error.message);
              return;
            }

            currentUser = data.user;
            await ensureProfile(
              currentUser.user_metadata?.username || email.split('@')[0]
            );
            openApp();
          }

          async function ensureProfile(username) {
            const {error} = await db.from('profiles').upsert({
              id: currentUser.id,
              username: username,
              full_name: username
            }, {onConflict: 'id', ignoreDuplicates: true});

            if (error) console.log('Profile setup:', error.message);
          }

          async function openApp() {
            document.getElementById('auth').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            await showPage('Home');
          }

          async function logout() {
            await db.auth.signOut();
            currentUser = null;
            document.getElementById('app').classList.add('hidden');
            document.getElementById('auth').classList.remove('hidden');
          }

          function escapeHTML(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({
              '&':'&amp;', '<':'&lt;', '>':'&gt;',
              '"':'&quot;', "'":'&#39;'
            }[c]));
          }

          async function showPage(page) {
            currentPage = page;
            document.querySelectorAll('.tab').forEach(t =>
              t.classList.toggle('active', t.dataset.page === page)
            );

            const c = document.getElementById('content');

            if (page === 'Home') {
              c.innerHTML = `
                <div class="card">
                  <div class="row">
                    <div class="avatar">${escapeHTML((currentUser?.email||'E')[0].toUpperCase())}</div>
                    <button style="flex:1;text-align:left" onclick="showPage('Create')">What's on your mind?</button>
                  </div>
                  <div class="actions">
                    <button onclick="showPage('Create')">📷 Photo / Post</button>
                    <button onclick="showPage('Reels')">▶ Video / Reels</button>
                  </div>
                </div>
                <div class="card">
                  <div class="section-title">Stories</div>
                  <div class="stories">
                    <div class="story" onclick="showPage('CreateStory')">＋ Create story</div>
                    <div class="story">Your friends</div>
                    <div class="story">Stories</div>
                  </div>
                </div>
                <div class="row" style="justify-content:space-between">
                  <div class="section-title">Your feed</div>
                  <button onclick="showPage('Home')">↻ Refresh</button>
                </div>
                <div id="feed">Loading posts…</div>`;
              await loadPosts();
              return;
            }

            if (page === 'Create') {
              c.innerHTML = `
                <div class="card">
                  <div class="section-title">Create a post</div>
                  <textarea id="posttext" rows="5" placeholder="What's on your mind?"></textarea>
                  <button class="blue full" onclick="createPost()">Publish post</button>
                  <p id="postmsg" class="muted"></p>
                </div>`;
              return;
            }

            if (page === 'Friends') {
              c.innerHTML = `
                <div class="card">
                  <div class="section-title">Friends</div>
                  <input id="friendsearch" placeholder="Search usernames">
                  <button class="blue full" onclick="searchPeople()">Search people</button>
                  <div id="people"></div>
                </div>
                <div class="card">
                  <div class="section-title">Friend requests</div>
                  <button class="full" onclick="loadRequests()">Refresh requests</button>
                  <div id="requests"></div>
                </div>`;
              return;
            }

            if (page === 'Messenger') {
              c.innerHTML = `
                <div class="card">
                  <div class="section-title">Messenger</div>
                  <p class="muted">Enter the recipient's user ID to start a conversation.</p>
                  <input id="recipient" placeholder="Recipient user ID">
                  <div id="messages"></div>
                  <textarea id="msgtext" placeholder="Write a message"></textarea>
                  <button class="blue full" onclick="sendMessage()">Send message</button>
                  <button class="full" onclick="loadMessages()">Refresh messages</button>
                  <p id="msgstatus" class="muted"></p>
                </div>`;
              return;
            }

            if (page === 'Reels') {
              c.innerHTML = `
                <div class="card">
                  <div class="section-title">Reels & Videos</div>
                  <p>Video feed</p>
                  <input id="videourl" placeholder="Public video URL">
                  <textarea id="videotext" placeholder="Video caption"></textarea>
                  <button class="blue full" onclick="createVideo()">Publish video post</button>
                  <div id="reelsfeed"></div>
                </div>`;
              await loadVideos();
              return;
            }

            if (page === 'Notifications') {
              c.innerHTML = `
                <div class="card">
                  <div class="section-title">Notifications</div>
                  <button class="full" onclick="loadNotifications()">Refresh notifications</button>
                  <div id="notices"></div>
                </div>`;
              await loadNotifications();
              return;
            }

            if (page === 'Marketplace') {
              c.innerHTML = `
                <div class="card">
                  <div class="section-title">Marketplace</div>
                  <input id="productname" placeholder="Product name">
                  <input id="productprice" type="number" placeholder="Price">
                  <input id="productimage" placeholder="Public product image URL (optional)">
                  <textarea id="productdesc" placeholder="Description"></textarea>
                  <button class="blue full" onclick="createListing()">List product</button>
                </div>
                <div id="marketfeed"></div>`;
              await loadListings();
              return;
            }

            if (page === 'CreateStory') {
              c.innerHTML = `
                <div class="card">
                  <div class="section-title">Create a story</div>
                  <textarea id="storytext" placeholder="Write a story"></textarea>
                  <input id="storyimage" placeholder="Public image URL (optional)">
                  <button class="blue full" onclick="createStory()">Share story</button>
                  <p id="storymsg"></p>
                </div>`;
              return;
            }

            if (page === 'Search') {
              c.innerHTML = `
                <div class="card">
                  <div class="section-title">Search people</div>
                  <input id="friendsearch" placeholder="Username">
                  <button class="blue full" onclick="searchPeople()">Search</button>
                  <div id="people"></div>
                </div>`;
              return;
            }

            if (page === 'Profile') {
              c.innerHTML = `
                <div class="card">
                  <div class="section-title">Your account</div>
                  <p>${escapeHTML(currentUser?.email)}</p>
                  <input id="editusername" placeholder="New username">
                  <input id="editname" placeholder="Full name">
                  <input id="editbio" placeholder="Biography">
                  <button class="blue full" onclick="saveProfile()">Save profile</button>
                  <button class="full" onclick="showPage('Home')">Home</button>
                  <button class="full" onclick="logout()">Log out</button>
                  <p id="profilemsg"></p>
                </div>`;
              return;
            }

            c.innerHTML = `<div class="card"><h3>${escapeHTML(page)}</h3><p>Choose an action from this screen.</p><button onclick="showPage('Home')">Back to Home</button></div>`;
          }

          async function loadPosts() {
            const box = document.getElementById('feed');
            if (!box) return;

            const {data, error} = await db.from('posts')
              .select('id,user_id,content,image_url,created_at')
              .order('created_at', {ascending:false})
              .limit(30);

            if (error) {
              box.innerHTML = `<div class="card error">Could not load posts: ${escapeHTML(error.message)}. Check your posts table and RLS policies.</div>`;
              return;
            }

            if (!data?.length) {
              box.innerHTML = '<div class="card">No posts yet. Be the first to publish!</div>';
              return;
            }

            box.innerHTML = data.map(p => `
              <article class="card">
                <div class="row">
                  <div class="avatar">E</div>
                  <div><b>EPIC user</b><div class="muted">${escapeHTML(p.created_at || '')}</div></div>
                </div>
                <div class="posttext">${escapeHTML(p.content)}</div>
                ${p.image_url ? `<img src="${escapeHTML(p.image_url)}" style="width:100%;border-radius:10px;margin-top:10px" alt="Post image">` : ''}
                <div class="actions">
                  <button onclick="likePost('${p.id}')">👍 Like</button>
                  <button onclick="commentPost('${p.id}')">💬 Comment</button>
                  <button onclick="sharePost('${p.id}')">↗ Share</button>
                </div>
              </article>`).join('');
          }

          async function createPost() {
            const content = document.getElementById('posttext').value.trim();
            if (!content) {
              message('postmsg', 'Write something first.');
              return;
            }

            const {error} = await db.from('posts').insert({
              user_id: currentUser.id,
              content
            });

            if (error) {
              message('postmsg', error.message);
              return;
            }

            await showPage('Home');
          }

          async function likePost(postId) {
            const {error} = await db.from('post_likes').upsert({
              post_id: postId,
              user_id: currentUser.id
            }, {onConflict:'post_id,user_id'});

            if (error) alert('Like failed: ' + error.message);
            else alert('Post liked!');
          }

          async function commentPost(postId) {
            const content = prompt('Write your comment:');
            if (!content?.trim()) return;

            const {error} = await db.from('comments').insert({
              post_id: postId,
              user_id: currentUser.id,
              content: content.trim()
            });

            if (error) alert('Comment failed: ' + error.message);
            else alert('Comment published.');
          }

          async function sharePost(postId) {
            const {data, error} = await db.from('posts')
              .select('content').eq('id', postId).single();

            if (error) {
              alert(error.message);
              return;
            }

            if (navigator.share) {
              try { await navigator.share({title:'EPIC post', text:data.content}); }
              catch(e) {}
            } else {
              alert(data.content || 'EPIC post');
            }
          }

          async function searchPeople() {
            const input = document.getElementById('friendsearch');
            const box = document.getElementById('people');
            if (!input || !box) return;

            const q = input.value.trim();
            const {data, error} = await db.from('profiles')
              .select('id,username,full_name')
              .ilike('username', '%' + q + '%')
              .limit(20);

            if (error) {
              box.textContent = error.message;
              return;
            }

            box.innerHTML = (data || []).filter(p => p.id !== currentUser.id)
              .map(p => `<div class="card">
                <b>${escapeHTML(p.full_name || p.username)}</b>
                <div class="muted">@${escapeHTML(p.username)}</div>
                <button onclick="sendFriendRequest('${p.id}')">Add friend</button>
              </div>`).join('') || 'No users found.';
          }

          async function sendFriendRequest(receiverId) {
            const {error} = await db.from('friend_requests').insert({
              sender_id: currentUser.id,
              receiver_id: receiverId,
              status: 'pending'
            });

            alert(error ? error.message : 'Friend request sent.');
          }

          async function loadRequests() {
            const box = document.getElementById('requests');
            if (!box) return;

            const {data, error} = await db.from('friend_requests')
              .select('id,sender_id,status,created_at')
              .eq('receiver_id', currentUser.id)
              .eq('status', 'pending');

            if (error) {
              box.textContent = error.message;
              return;
            }

            box.innerHTML = (data || []).map(r => `
              <div class="card">
                <p>Friend request from ${escapeHTML(r.sender_id)}</p>
                <button class="blue" onclick="answerRequest('${r.id}','accepted')">Accept</button>
                <button onclick="answerRequest('${r.id}','rejected')">Reject</button>
              </div>`).join('') || 'No pending requests.';
          }

          async function answerRequest(id, status) {
            const {error} = await db.from('friend_requests')
              .update({status})
              .eq('id', id)
              .eq('receiver_id', currentUser.id);

            alert(error ? error.message : 'Request updated.');
            await loadRequests();
          }

          async function sendMessage() {
            const recipient = document.getElementById('recipient').value.trim();
            const content = document.getElementById('msgtext').value.trim();

            if (!recipient || !content) {
              message('msgstatus', 'Enter a recipient ID and message.');
              return;
            }

            const {error} = await db.from('messages').insert({
              sender_id: currentUser.id,
              receiver_id: recipient,
              content
            });

            message('msgstatus', error ? error.message : 'Message sent.');
            if (!error) document.getElementById('msgtext').value = '';
          }

          async function loadMessages() {
            const recipient = document.getElementById('recipient').value.trim();
            const box = document.getElementById('messages');
            if (!recipient) {
              box.textContent = 'Enter a recipient ID first.';
              return;
            }

            const {data, error} = await db.from('messages')
              .select('sender_id,receiver_id,content,created_at')
              .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${recipient}),and(sender_id.eq.${recipient},receiver_id.eq.${currentUser.id})`)
              .order('created_at');

            if (error) {
              box.textContent = error.message;
              return;
            }

            box.innerHTML = (data || []).map(m => `
              <div class="card">
                <b>${m.sender_id === currentUser.id ? 'You' : 'Them'}</b>
                <p>${escapeHTML(m.content)}</p>
                <div class="muted">${escapeHTML(m.created_at)}</div>
              </div>`).join('') || 'No messages yet.';
          }

          async function createVideo() {
            const url = document.getElementById('videourl').value.trim();
            const content = document.getElementById('videotext').value.trim();
            if (!url) {
              alert('Enter a public video URL.');
              return;
            }

            const {error} = await db.from('posts').insert({
              user_id: currentUser.id,
              content,
              image_url: url
            });

            alert(error ? error.message : 'Video post published.');
            if (!error) showPage('Reels');
          }

          async function loadVideos() {
            const box = document.getElementById('reelsfeed');
            const {data, error} = await db.from('posts')
              .select('id,content,image_url,created_at')
              .not('image_url', 'is', null)
              .order('created_at', {ascending:false})
              .limit(20);

            if (error) {
              box.textContent = error.message;
              return;
            }

            box.innerHTML = (data || []).map(p => `
              <div class="card">
                <p>${escapeHTML(p.content)}</p>
                <video controls playsinline style="width:100%" src="${escapeHTML(p.image_url)}"></video>
              </div>`).join('') || 'No video posts yet.';
          }

          async function createStory() {
            const content = document.getElementById('storytext').value.trim();
            const image = document.getElementById('storyimage').value.trim();

            const {error} = await db.from('stories').insert({
              user_id: currentUser.id,
              content,
              image_url: image || null
            });

            message('storymsg', error ? error.message : 'Story shared.');
          }

          async function loadNotifications() {
            const box = document.getElementById('notices');
            const {data, error} = await db.from('notifications')
              .select('id,type,content,created_at')
              .eq('user_id', currentUser.id)
              .order('created_at', {ascending:false})
              .limit(50);

            if (error) {
              box.textContent = error.message;
              return;
            }

            box.innerHTML = (data || []).map(n => `
              <div class="card">
                <b>${escapeHTML(n.type)}</b>
                <p>${escapeHTML(n.content)}</p>
                <div class="muted">${escapeHTML(n.created_at)}</div>
              </div>`).join('') || 'No notifications yet.';
          }

          async function createListing() {
            const title = document.getElementById('productname').value.trim();
            const price = Number(document.getElementById('productprice').value);
            const description = document.getElementById('productdesc').value.trim();
            const image_url = document.getElementById('productimage').value.trim() || null;

            if (!title || !Number.isFinite(price) || price < 0) {
              alert('Enter a product name and valid price.');
              return;
            }

            const {error} = await db.from('marketplace_listings').insert({
              seller_id: currentUser.id,
              title,
              price,
              description,
              image_url
            });

            alert(error ? error.message : 'Product listed.');
            if (!error) showPage('Marketplace');
          }

          async function loadListings() {
            const box = document.getElementById('marketfeed');
            const {data, error} = await db.from('marketplace_listings')
              .select('id,seller_id,title,price,description,image_url,created_at')
              .order('created_at', {ascending:false})
              .limit(50);

            if (error) {
              box.innerHTML = `<div class="card error">${escapeHTML(error.message)}</div>`;
              return;
            }

            box.innerHTML = (data || []).map(p => `
              <div class="card">
                ${p.image_url ? `<img src="${escapeHTML(p.image_url)}" style="width:100%;border-radius:8px" alt="Product">` : ''}
                <h3>${escapeHTML(p.title)}</h3>
                <b>$${Number(p.price).toFixed(2)}</b>
                <p>${escapeHTML(p.description)}</p>
                <div class="muted">Seller: ${escapeHTML(p.seller_id)}</div>
                <button onclick="alert('Contact the seller through Messenger using their user ID: ${escapeHTML(p.seller_id)}')">Contact seller</button>
              </div>`).join('') || 'No listings yet.';
          }

          async function saveProfile() {
            const username = document.getElementById('editusername').value.trim();
            const full_name = document.getElementById('editname').value.trim();
            const bio = document.getElementById('editbio').value.trim();

            const changes = {id:currentUser.id};
            if (username) changes.username = username;
            if (full_name) changes.full_name = full_name;
            if (bio) changes.bio = bio;

            const {error} = await db.from('profiles').upsert(changes, {onConflict:'id'});
            message('profilemsg', error ? error.message : 'Profile saved.');
          }

          db.auth.getSession().then(async ({data}) => {
            if (data.session) {
              currentUser = data.session.user;
              openApp();
            }
          });
          </script>
          </body>
          </html>
          EOF

          python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path("app/src/main/assets/index.html")
          s = p.read_text()
          s = s.replace("SUPABASE_URL_PLACEHOLDER", os.environ["SUPABASE_URL"])
          s = s.replace("SUPABASE_KEY_PLACEHOLDER", os.environ["SUPABASE_KEY"])
          p.write_text(s)
          PY

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload EPIC APK
        uses: actions/upload-artifact@v4
        with:
          name: EPIC-Android
          path: app/build/outputs/apk/debug/app-debug.apk
