          $("publishPost").addEventListener("click", async () => {
            if (!currentUser) return;

            const content = $("postText").value.trim();
            const imageUrl = safeUrl($("postImageUrl").value.trim());

            if (!content && !imageUrl) {
              return showMessage("feedMessage", "Write something or add an image URL.", true);
            }

            try {
              const { error } = await supabaseClient.from("posts").insert({
                user_id: currentUser.id,
                content: content || "",
                image_url: imageUrl || null
              });

              if (error) throw error;

              $("postText").value = "";
              $("postImageUrl").value = "";
              $("postComposer").classList.add("hidden");
              hideMessage("feedMessage");
              await loadFeed();
            } catch (error) {
              showMessage("feedMessage", error.message || "Could not publish post.", true);
            }
          });

          async function loadFeed() {
            if (!currentUser) return;

            const feed = $("feed");
            feed.innerHTML = '<div class="card">Loading posts…</div>';

            try {
              const { data: posts, error } = await supabaseClient
                .from("posts").select("*").order("created_at", { ascending: false }).limit(50);

              if (error) throw error;

              if (!posts || posts.length === 0) {
                feed.innerHTML = '<div class="card">No posts yet. Be the first to share something!</div>';
                return;
              }

              const userIds = [...new Set(posts.map(post => post.user_id).filter(Boolean))];
              let profiles = [];

              if (userIds.length) {
                const result = await supabaseClient
                  .from("profiles").select("id,username,full_name,avatar_url").in("id", userIds);
                if (!result.error) profiles = result.data || [];
              }

              const profileMap = Object.fromEntries(profiles.map(profile => [profile.id, profile]));

              feed.innerHTML = posts.map(post => {
                const profile = profileMap[post.user_id] || {};
                const postId = shortId(post.id);
                const imageUrl = safeUrl(post.image_url || "");
                const isVideo = /\.(mp4|webm|m4v)(?:[?#].*)?$/i.test(imageUrl);
                const avatarUrl = safeUrl(profile.avatar_url || "");
                const displayName = profile.full_name || profile.username || "EPIC user";

                return `
                  <div class="card">
                    <div class="row">
                      <div class="avatar">
                        ${avatarUrl ? `<img src="${escapeHtml(avatarUrl)}" alt="">` : escapeHtml(displayName.charAt(0).toUpperCase())}
                      </div>
                      <div>
                        <strong>${escapeHtml(displayName)}</strong>
                        <div class="muted">@${escapeHtml(profile.username || "user")} · ${escapeHtml(formatDate(post.created_at))}</div>
                      </div>
                    </div>
                    ${post.content ? `<div class="post-content">${escapeHtml(post.content)}</div>` : ""}
                    ${imageUrl ? (isVideo
                      ? `<video class="post-image" src="${escapeHtml(imageUrl)}" controls playsinline preload="metadata"></video>`
                      : `<img class="post-image" src="${escapeHtml(imageUrl)}" alt="Post image" loading="lazy">`) : ""}
                    <div class="row spread muted">
                      <span id="like-count-${postId}">Likes</span>
                      <span id="comment-count-${postId}">Comments</span>
                    </div>
                    <div class="post-actions">
                      <button data-like="${postId}" data-post-id="${escapeHtml(post.id)}">♡ Like</button>
                      <button data-comment="${postId}" data-post-id="${escapeHtml(post.id)}">▢ Comment</button>
                      <button data-share="${postId}" data-post-id="${escapeHtml(post.id)}">↗ Share</button>
                    </div>
                    <div id="comments-${postId}" class="comment-box hidden"></div>
                  </div>`;
              }).join("");

              await Promise.all(posts.map(post => loadPostStats(post)));
              attachFeedActions();
            } catch (error) {
              feed.innerHTML = `<div class="card">Could not load feed: ${escapeHtml(error.message || "Unknown error")}</div>`;
            }
          }

          function formatDate(value) {
            if (!value) return "";
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return "";
            return date.toLocaleString();
          }

          async function loadPostStats(post) {
            const postId = shortId(post.id);

            try {
              const { count, error } = await supabaseClient
                .from("post_likes").select("*", { count: "exact", head: true }).eq("post_id", post.id);

              if (!error) $("like-count-" + postId).textContent = `${count || 0} likes`;

              const { data: myLike, error: likeError } = await supabaseClient
                .from("post_likes").select("post_id").eq("post_id", post.id)
                .eq("user_id", currentUser.id).maybeSingle();

              if (!likeError && myLike) {
                const button = document.querySelector(`[data-like="${postId}"]`);
                if (button) {
                  button.classList.add("liked");
                  button.textContent = "♥ Liked";
                }
              }
            } catch (error) {
              console.warn("Post stats unavailable:", error);
            }

            try {
              const { count, error } = await supabaseClient
                .from("comments").select("*", { count: "exact", head: true }).eq("post_id", post.id);

              if (!error) {
                const el = $("comment-count-" + postId);
                if (el) el.textContent = `${count || 0} comments`;
              }
            } catch (_) {}
          }

          function attachFeedActions() {
            document.querySelectorAll("[data-like]").forEach(button => {
              button.onclick = async () => {
                const postId = button.dataset.postId;
                const liked = button.classList.contains("liked");

                try {
                  if (liked) {
                    const { error } = await supabaseClient.from("post_likes").delete()
                      .eq("post_id", postId).eq("user_id", currentUser.id);
                    if (error) throw error;
                    button.classList.remove("liked");
                    button.textContent = "♡ Like";
                  } else {
                    const { error } = await supabaseClient.from("post_likes").upsert({
                      post_id: postId,
                      user_id: currentUser.id
                    }, { onConflict: "post_id,user_id" });
                    if (error) throw error;
                    button.classList.add("liked");
                    button.textContent = "♥ Liked";
                  }

                  const { count, error } = await supabaseClient
                    .from("post_likes").select("*", { count: "exact", head: true }).eq("post_id", postId);

                  if (!error) {
                    const countEl = $("like-count-" + shortId(postId));
                    if (countEl) countEl.textContent = `${count || 0} likes`;
                  }
                } catch (error) {
                  alert(error.message || "Could not update like.");
                }
              };
            });

            document.querySelectorAll("[data-comment]").forEach(button => {
              button.onclick = async () => {
                const postId = button.dataset.postId;
                const container = $("comments-" + shortId(postId));
                container.classList.toggle("hidden");
                if (!container.classList.contains("hidden")) await loadComments(postId, container);
              };
            });

            document.querySelectorAll("[data-share]").forEach(button => {
              button.onclick = async () => {
                const postId = button.dataset.postId;
                const shareText = "Check out this post on EPIC: " + postId;

                try {
                  if (navigator.share) await navigator.share({ title: "EPIC post", text: shareText });
                  else if (navigator.clipboard) {
                    await navigator.clipboard.writeText(shareText);
                    alert("Post reference copied.");
                  } else prompt("Copy this post reference:", shareText);
                } catch (_) {}
              };
            });
          }

          async function loadComments(postId, container) {
            container.innerHTML = `
              <form class="comment-form">
                <input class="field" name="comment" placeholder="Write a comment" required>
                <button class="primary" type="submit">Comment</button>
              </form>
              <div class="comments-list">Loading comments…</div>`;

            container.querySelector(".comment-form").addEventListener("submit", async event => {
              event.preventDefault();
              const input = event.currentTarget.elements.comment;
              const content = input.value.trim();
              if (!content) return;

              try {
                const { error } = await supabaseClient.from("comments").insert({
                  post_id: postId, user_id: currentUser.id, content
                });
                if (error) throw error;
                await loadComments(postId, container);
              } catch (error) {
                alert("Could not comment: " + (error.message || "Unknown error"));
              }
            });

            const list = container.querySelector(".comments-list");

            try {
              const { data, error } = await supabaseClient.from("comments").select("*")
                .eq("post_id", postId).order("created_at", { ascending: true }).limit(100);
              if (error) throw error;

              if (!data || data.length === 0) {
                list.innerHTML = '<p class="muted">No comments yet.</p>';
                return;
              }

              const userIds = [...new Set(data.map(comment => comment.user_id).filter(Boolean))];
              let profiles = [];

              if (userIds.length) {
                const result = await supabaseClient.from("profiles")
                  .select("id,username,full_name").in("id", userIds);
                if (!result.error) profiles = result.data || [];
              }

              const profileMap = Object.fromEntries(profiles.map(profile => [profile.id, profile]));
              list.innerHTML = data.map(comment => {
                const profile = profileMap[comment.user_id] || {};
                return `<div class="comment"><strong>${escapeHtml(profile.full_name || profile.username || "User")}</strong> ${escapeHtml(comment.content || "")}</div>`;
              }).join("");

              const countEl = $("comment-count-" + shortId(postId));
              if (countEl) countEl.textContent = `${data.length} comments`;
            } catch (error) {
              list.textContent = "Comments could not be loaded: " + (error.message || "");
            }
          }

          $("publishVideo").addEventListener("click", createVideo);

          async function createVideo() {
