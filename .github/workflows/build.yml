            const videoUrl = safeUrl($("videoUrl").value.trim());
            const caption = $("videoCaption").value.trim();

            if (!videoUrl) return showMessage("reelMessage", "Enter a valid video URL.", true);
            if (!/\.(mp4|webm|m4v)(?:[?#].*)?$/i.test(videoUrl)) {
              return showMessage("reelMessage", "Use a direct MP4, WebM or M4V video URL.", true);
            }

            showMessage("reelMessage", "Publishing reel…");

            try {
              const { error } = await supabaseClient.from("posts").insert({
                user_id: currentUser.id, content: caption, image_url: videoUrl
              });
              if (error) throw error;

              $("videoUrl").value = "";
              $("videoCaption").value = "";
              showMessage("reelMessage", "Reel published.");
              await loadVideos();
            } catch (error) {
              showMessage("reelMessage", error.message || "Could not publish reel.", true);
            }
          }

          async function loadVideos() {
            const container = $("videos");
            if (!currentUser) return;

            if (reelObserver) {
              reelObserver.disconnect();
              reelObserver = null;
            }

            container.innerHTML = '<div class="reel-empty">Loading reels…</div>';

            try {
              const { data: posts, error } = await supabaseClient.from("posts").select("*")
                .not("image_url", "is", null).order("created_at", { ascending: false }).limit(100);
              if (error) throw error;

              const videos = (posts || []).filter(post =>
                /\.(mp4|webm|m4v)(?:[?#].*)?$/i.test(safeUrl(post.image_url || ""))
              );

              if (!videos.length) {
                container.innerHTML = '<div class="reel-empty"><h3>▶ No reels yet</h3>Publish a reel using a direct video URL above.</div>';
                return;
              }

              const userIds = [...new Set(videos.map(post => post.user_id).filter(Boolean))];
              let profiles = [];

              if (userIds.length) {
                const result = await supabaseClient.from("profiles")
                  .select("id,username,full_name,avatar_url").in("id", userIds);
                if (!result.error) profiles = result.data || [];
              }

              const profileMap = Object.fromEntries(profiles.map(profile => [profile.id, profile]));

              container.innerHTML = videos.map(post => {
                const profile = profileMap[post.user_id] || {};
                const postId = shortId(post.id);
                const videoUrl = safeUrl(post.image_url || "");
                const creator = profile.full_name || profile.username || "EPIC user";

                return `
                  <div class="reel-card">
                    <video class="reel-video" src="${escapeHtml(videoUrl)}" playsinline loop muted preload="metadata"></video>
                    <div class="reel-top-gradient"></div>
                    <div class="reel-bottom-gradient"></div>
                    <button class="reel-sound" data-sound="${postId}">🔇</button>
                    <button class="reel-play" data-play="${postId}">▶</button>
                    <div class="reel-user">
                      <div class="reel-username">@${escapeHtml(profile.username || creator)}</div>
                      <div class="reel-caption">${escapeHtml(post.content || "")}</div>
                    </div>
                    <div class="reel-side-actions">
                      <button class="reel-action" data-reel-like="${postId}" data-post-id="${escapeHtml(post.id)}"><span>♡</span><small id="reel-likes-${postId}">0</small></button>
                      <button class="reel-action" data-reel-comment="${postId}" data-post-id="${escapeHtml(post.id)}">▢<small>Comment</small></button>
                      <button class="reel-action" data-reel-share="${postId}" data-post-id="${escapeHtml(post.id)}">↗<small>Share</small></button>
                    </div>
                  </div>`;
              }).join("");

              attachReelActions(videos);
              observeReels();
            } catch (error) {
              container.innerHTML = `<div class="reel-empty">Could not load reels. ${escapeHtml(error.message || "Unknown error")}</div>`;
            }
          }

          function observeReels() {
            if (reelObserver) reelObserver.disconnect();

            const videos = [...document.querySelectorAll("#videos .reel-video")];

            if (!("IntersectionObserver" in window)) {
              videos.forEach(video => {
                video.muted = true;
                video.play().catch(() => {});
              });
              return;
            }

            reelObserver = new IntersectionObserver(entries => {
              entries.forEach(entry => {
                const video = entry.target;

                if (entry.isIntersecting && entry.intersectionRatio >= 0.65) {
                  videos.forEach(otherVideo => {
                    if (otherVideo !== video) otherVideo.pause();
                  });
                  video.play().catch(() => {});
                } else {
                  video.pause();
                }
              });
            }, { threshold: [0, 0.35, 0.65, 0.9] });

            videos.forEach(video => reelObserver.observe(video));
          }

          function attachReelActions(posts) {
            const postMap = Object.fromEntries(posts.map(post => [shortId(post.id), post]));

            document.querySelectorAll("[data-play]").forEach(button => {
              button.onclick = () => {
                const video = button.closest(".reel-card")?.querySelector("video");
                if (!video) return;

                if (video.paused) {
                  video.play().catch(() => {});
                  button.textContent = "Ⅱ";
                } else {
                  video.pause();
                  button.textContent = "▶";
                }
              };
            });

            document.querySelectorAll("[data-sound]").forEach(button => {
              button.onclick = () => {
                const video = button.closest(".reel-card")?.querySelector("video");
                if (!video) return;
                video.muted = !video.muted;
                button.textContent = video.muted ? "🔇" : "🔊";
              };
            });

            document.querySelectorAll("[data-reel-like]").forEach(button => {
              const postId = button.dataset.postId;
              const reelId = button.dataset.reelLike;

              (async () => {
                try {
                  const { data, error } = await supabaseClient.from("post_likes")
                    .select("post_id").eq("post_id", postId)
                    .eq("user_id", currentUser.id).maybeSingle();

                  if (!error && data) {
                    button.classList.add("liked");
                    button.querySelector("span").textContent = "♥";
                  }

                  const { count, error: countError } = await supabaseClient
                    .from("post_likes").select("*", { count: "exact", head: true }).eq("post_id", postId);

                  if (!countError) $("reel-likes-" + reelId).textContent = String(count || 0);
                } catch (_) {}
              })();

              button.onclick = async () => {
                const liked = button.classList.contains("liked");

                try {
                  if (liked) {
                    const { error } = await supabaseClient.from("post_likes").delete()
                      .eq("post_id", postId).eq("user_id", currentUser.id);
                    if (error) throw error;
                    button.classList.remove("liked");
                    button.querySelector("span").textContent = "♡";
                  } else {
                    const { error } = await supabaseClient.from("post_likes").upsert({
                      post_id: postId, user_id: currentUser.id
                    }, { onConflict: "post_id,user_id" });
                    if (error) throw error;
                    button.classList.add("liked");
                    button.querySelector("span").textContent = "♥";
                  }

                  const { count, error: countError } = await supabaseClient
                    .from("post_likes").select("*", { count: "exact", head: true }).eq("post_id", postId);
                  if (!countError) $("reel-likes-" + reelId).textContent = String(count || 0);
                } catch (error) {
                  alert(error.message || "Could not update like.");
                }
              };
            });

            document.querySelectorAll("[data-reel-comment]").forEach(button => {
              button.onclick = async () => {
                const postId = button.dataset.postId;
                const comment = prompt("Write your comment:");
                if (!comment || !comment.trim()) return;

                try {
                  const { error } = await supabaseClient.from("comments").insert({
                    post_id: postId, user_id: currentUser.id, content: comment.trim()
                  });
                  if (error) throw error;
                  alert("Comment added.");
                } catch (error) {
                  alert("Could not comment: " + (error.message || "Unknown error"));
                }
              };
            });

            document.querySelectorAll("[data-reel-share]").forEach(button => {
              button.onclick = async () => {
                const postId = button.dataset.postId;
                const shareText = "Watch this EPIC reel: " + postId;

                try {
                  if (navigator.share) await navigator.share({ title: "EPIC Reel", text: shareText });
                  else if (navigator.clipboard) {
                    await navigator.clipboard.writeText(shareText);
                    alert("Reel reference copied.");
                  } else prompt("Copy this reel reference:", shareText);
                } catch (_) {}
              };
            });
          }

          async function findPeople(inputId, resultsId) {
            const query = $(inputId).value.trim().replace(/^@/, "");
            const results = $(resultsId);

            if (!query) {
              results.textContent = "Enter a name or username to search.";
              return;
            }

            results.textContent = "Searching…";

            try {
              const { data, error } = await supabaseClient.from("profiles")
                .select("id,username,full_name,avatar_url")
                .or(`username.ilike.%${query}%,full_name.ilike.%${query}%`)
                .neq("id", currentUser.id).limit(30);

              if (error) throw error;
              if (!data || !data.length) {
                results.textContent = "No people found.";
                return;
              }

              results.innerHTML = data.map(profile => `
                <div class="list-item">
                  <div class="avatar">${escapeHtml((profile.full_name || profile.username || "U").charAt(0).toUpperCase())}</div>
                  <div class="item-body">
                    <strong>${escapeHtml(profile.full_name || profile.username)}</strong>
                    <p class="muted">@${escapeHtml(profile.username || "")}</p>
                  </div>
                  <button class="secondary" data-add-friend="${escapeHtml(profile.id)}">Add</button>
                  <button class="secondary" data-message-user="${escapeHtml(profile.id)}" data-message-username="${escapeHtml(profile.username || "")}">Message</button>
                </div>
              `).join("");

              results.querySelectorAll("[data-add-friend]").forEach(button => {
                button.onclick = () => sendFriendRequest(button.dataset.addFriend, button);
              });

              results.querySelectorAll("[data-message-user]").forEach(button => {
                button.onclick = () => openConversation(button.dataset.messageUser, button.dataset.messageUsername);
              });
            } catch (error) {
              results.textContent = "Search failed: " + (error.message || "Unknown error");
            }
          }

          $("findFriends").addEventListener("click", () => findPeople("friendSearch", "friendResults"));
          $("globalSearchButton").addEventListener("click", () => findPeople("globalSearch", "globalSearchResults"));

          async function sendFriendRequest(receiverId, button) {
            if (!currentUser || receiverId === currentUser.id) return;

            try {
              const { data: existing, error: lookupError } = await supabaseClient
                .from("friend_requests").select("id,status")
                .eq("sender_id", currentUser.id).eq("receiver_id", receiverId).maybeSingle();

              if (lookupError) throw lookupError;

              if (existing) {
                button.textContent = existing.status === "accepted" ? "Friends" : "Requested";
                button.disabled = true;
                return;
              }

              const { error } = await supabaseClient.from("friend_requests").insert({
                sender_id: currentUser.id, receiver_id: receiverId, status: "pending"
              });

              if (error) throw error;
              button.textContent = "Requested";
              button.disabled = true;
            } catch (error) {
              alert(error.message || "Could not send friend request.");
            }
          }

          async function loadFriendRequests() {
            if (!currentUser) return;

            const container = $("friendRequests");
            container.textContent = "Loading requests…";

            try {
              const { data, error } = await supabaseClient.from("friend_requests")
                .select("*").eq("receiver_id", currentUser.id).eq("status", "pending")
                .order("created_at", { ascending: false });

              if (error) throw error;
              if (!data || !data.length) {
                container.textContent = "No pending requests.";
                return;
              }

              const ids = data.map(item => item.sender_id);
              const result = await supabaseClient.from("profiles")
                .select("id,username,full_name").in("id", ids);

              const profiles = result.data || [];
              const profileMap = Object.fromEntries(profiles.map(profile => [profile.id, profile]));

              container.innerHTML = data.map(request => {
                const profile = profileMap[request.sender_id] || {};
                return `
                  <div class="list-item">
                    <div class="item-body">
                      <strong>${escapeHtml(profile.full_name || profile.username || "User")}</strong>
                      <p class="muted">@${escapeHtml(profile.username || "")}</p>
                    </div>
                    <button class="secondary" data-accept="${escapeHtml(request.id)}">Accept</button>
                  </div>`;
              }).join("");

              container.querySelectorAll("[data-accept]").forEach(button => {
                button.onclick = async () => {
                  try {
                    const { error } = await supabaseClient.from("friend_requests")
                      .update({ status: "accepted" }).eq("id", button.dataset.accept)
                      .eq("receiver_id", currentUser.id);
                    if (error) throw error;
                    await loadFriendRequests();
                    await loadFriends();
                  } catch (error) {
                    alert(error.message || "Could not accept request.");
                  }
                };
              });
            } catch (error) {
              container.textContent = "Could not load requests: " + (error.message || "");
            }
          }

          async function loadFriends() {
            if (!currentUser) return;

            const container = $("friendsList");
            container.textContent = "Loading friends…";

            try {
              const { data, error } = await supabaseClient.from("friend_requests")
                .select("*").eq("status", "accepted")
                .or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`).limit(200);

              if (error) throw error;

              const ids = [...new Set((data || []).map(item =>
                item.sender_id === currentUser.id ? item.receiver_id : item.sender_id
              ))];

              if (!ids.length) {
                container.textContent = "Your friends will appear here.";
                return;
              }

              const result = await supabaseClient.from("profiles")
                .select("id,username,full_name").in("id", ids);
              if (result.error) throw result.error;

              container.innerHTML = (result.data || []).map(profile => `
                <div class="list-item">
                  <div class="avatar">${escapeHtml((profile.full_name || profile.username || "U").charAt(0).toUpperCase())}</div>
                  <div class="item-body">
                    <strong>${escapeHtml(profile.full_name || profile.username || "User")}</strong>
                    <p class="muted">@${escapeHtml(profile.username || "")}</p>
                  </div>
                  <button class="secondary" data-message-user="${escapeHtml(profile.id)}" data-message-username="${escapeHtml(profile.username || "")}">Message</button>
                </div>
              `).join("");

              container.querySelectorAll("[data-message-user]").forEach(button => {
                button.onclick = () => openConversation(button.dataset.messageUser, button.dataset.messageUsername);
              });
            } catch (error) {
              container.textContent = "Could not load friends: " + (error.message || "");
            }
          }

          $("startConversation").addEventListener("click", async () => {
            const username = $("messageRecipient").value.trim().replace(/^@/, "");
            if (!username) return;

            try {
              const { data, error } = await supabaseClient.from("profiles")
                .select("id,username,full_name").eq("username", username).maybeSingle();

              if (error) throw error;
              if (!data) return alert("User not found.");
              await openConversation(data.id, data.username);
            } catch (error) {
              alert(error.message || "Could not find user.");
            }
          });

          async function openConversation(userId, username) {
            if (!userId || userId === currentUser.id) return;

            activeConversationUser = { id: userId, username };
            showPage("messenger");
            await loadConversation();

            if (messagePollTimer) clearInterval(messagePollTimer);
            messagePollTimer = setInterval(() => {
              if (activeConversationUser) loadConversation();
            }, 8000);
          }

          async function loadConversation() {
            if (!activeConversationUser || !currentUser) return;

            const container = $("conversation");
            container.innerHTML = `
              <h3>Chat with @${escapeHtml(activeConversationUser.username || "user")}</h3>
              <div id="messageList" style="max-height:50vh;overflow:auto"></div>
              <form id="messageForm" class="row">
                <input class="field" name="message" placeholder="Write a message" required>
                <button class="primary" type="submit">Send</button>
              </form>`;

            const form = $("messageForm");
            form.addEventListener("submit", async event => {
              event.preventDefault();
              const input = form.elements.message;
              const content = input.value.trim();
              if (!content) return;

              try {
                const { error } = await supabaseClient.from("messages").insert({
                  sender_id: currentUser.id,
                  receiver_id: activeConversationUser.id,
                  content
                });

                if (error) throw error;
                input.value = "";
                await loadConversation();
              } catch (error) {
                alert("Could not send message: " + (error.message || "Unknown error"));
              }
            });

            const list = $("messageList");
            list.innerHTML = '<p class="muted">Loading messages…</p>';

            try {
              const { data, error } = await supabaseClient.from("messages").select("*")
                .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${activeConversationUser.id}),and(sender_id.eq.${activeConversationUser.id},receiver_id.eq.${currentUser.id})`)
                .order("created_at", { ascending: true }).limit(200);

              if (error) throw error;

              list.innerHTML = (data || []).map(message => {
                const mine = message.sender_id === currentUser.id;
                return `
                  <div style="display:flex;justify-content:${mine ? "flex-end" : "flex-start"};margin:8px 0">
                    <div style="background:${mine ? "#dbeafe" : "#e4e6eb"};padding:9px 12px;border-radius:12px;max-width:85%;overflow-wrap:anywhere">
                      ${escapeHtml(message.content || "")}
                      <div class="muted">${escapeHtml(formatDate(message.created_at))}</div>
                    </div>
                  </div>`;
              }).join("") || '<p class="muted">No messages yet. Say hello!</p>';

              list.scrollTop = list.scrollHeight;
            } catch (error) {
              list.textContent = "Could not load messages: " + (error.message || "");
            }
          }

          async function loadNotifications() {
            if (!currentUser) return;

            const container = $("notificationsList");
            container.textContent = "Loading notifications…";

            try {
              const { data, error } = await supabaseClient.from("notifications")
                .select("*").eq("user_id", currentUser.id)
                .order("created_at", { ascending: false }).limit(100);

              if (error) throw error;
              if (!data || !data.length) {
                container.textContent = "You're all caught up.";
                return;
              }

              container.innerHTML = data.map(notification => `
                <div class="list-item">
                  <div class="avatar">♧</div>
                  <div class="item-body">
                    <p>${escapeHtml(notification.content || notification.message || "New notification")}</p>
                    <p class="muted">${escapeHtml(formatDate(notification.created_at))}</p>
                  </div>
                </div>
              `).join("");
            } catch (error) {
              container.textContent = "Could not load notifications: " + (error.message || "");
            }
          }

          $("publishListing").addEventListener("click", async () => {
            if (!currentUser) return;

            const title = $("marketTitle").value.trim();
            const price = Number($("marketPrice").value);
            const description = $("marketDescription").value.trim();
            const imageUrl = safeUrl($("marketImage").value.trim());

            if (!title) return showMessage("marketMessage", "Enter an item name.", true);
            if (!Number.isFinite(price) || price < 0) {
              return showMessage("marketMessage", "Enter a valid price.", true);
            }

            showMessage("marketMessage", "Publishing listing…");

            try {
              const { error } = await supabaseClient.from("marketplace_listings").insert({
                user_id: currentUser.id, title, price, description, image_url: imageUrl || null
              });

              if (error) throw error;

              $("marketTitle").value = "";
              $("marketPrice").value = "";
              $("marketDescription").value = "";
              $("marketImage").value = "";

              showMessage("marketMessage", "Listing published.");
              await loadMarketplace();
            } catch (error) {
              showMessage("marketMessage", error.message || "Could not publish listing.", true);
            }
          });

          async function loadMarketplace() {
            if (!currentUser) return;

            const container = $("marketListings");
            container.innerHTML = '<div class="card">Loading marketplace…</div>';

            try {
              const { data, error } = await supabaseClient.from("marketplace_listings")
                .select("*").order("created_at", { ascending: false }).limit(100);

              if (error) throw error;
              if (!data || !data.length) {
                container.innerHTML = '<div class="card">No marketplace listings yet.</div>';
                return;
              }

              const ids = [...new Set(data.map(item => item.user_id).filter(Boolean))];
              let profiles = [];

              if (ids.length) {
                const result = await supabaseClient.from("profiles")
                  .select("id,username,full_name").in("id", ids);
                if (!result.error) profiles = result.data || [];
              }

              const profileMap = Object.fromEntries(profiles.map(profile => [profile.id, profile]));

              container.innerHTML = data.map(item => {
                const imageUrl = safeUrl(item.image_url || "");
                const profile = profileMap[item.user_id] || {};

                return `
                  <div class="card">
                    ${imageUrl ? `<img class="post-image" src="${escapeHtml(imageUrl)}" alt="Listing image" loading="lazy">` : ""}
                    <h3>${escapeHtml(item.title || "Item")}</h3>
                    <strong>${escapeHtml(String(item.price ?? ""))}</strong>
                    <p>${escapeHtml(item.description || "")}</p>
                    <p class="muted">Listed by ${escapeHtml(profile.full_name || profile.username || "EPIC user")}</p>
                    <button class="primary" data-contact-seller="${escapeHtml(profile.username || "")}">Contact seller</button>
                  </div>`;
              }).join("");

              container.querySelectorAll("[data-contact-seller]").forEach(button => {
                button.onclick = async () => {
                  const username = button.dataset.contactSeller;
                  if (!username) return alert("Seller profile unavailable.");

                  try {
                    const { data, error } = await supabaseClient.from("profiles")
                      .select("id,username").eq("username", username).maybeSingle();
                    if (error) throw error;
                    if (!data) return alert("Seller not found.");
                    await openConversation(data.id, data.username);
                  } catch (error) {
                    alert(error.message || "Could not contact seller.");
                  }
                };
              });
            } catch (error) {
              container.innerHTML = `<div class="card">Could not load marketplace: ${escapeHtml(error.message || "")}</div>`;
            }
          }

          async function logout() {
            if (messagePollTimer) clearInterval(messagePollTimer);
            messagePollTimer = null;
            activeConversationUser = null;

            try {
              if (supabaseClient) {
                const { error } = await supabaseClient.auth.signOut();
                if (error) throw error;
              }
            } catch (error) {
              alert(error.message || "Could not log out.");
              return;
            }

            currentUser = null;
            currentProfile = null;
            $("appScreen").classList.add("hidden");
            $("authScreen").classList.remove("hidden");
            $("loginPassword").value = "";
            switchAuthForm(false);
          }

          $("logoutButton").addEventListener("click", logout);
          $("menuLogout").addEventListener("click", logout);

          document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
              document.querySelectorAll(".reel-video").forEach(video => video.pause());
            }
          });

          initialise();
          </script>
          </body>
          </html>
          EOF

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O gradle.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build installable APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK for installation
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/EPIC.apk

      - name: Upload installable EPIC APK
        uses: actions/upload-artifact@v4
        with:
          name: EPIC-Installable-APK
          path: output/EPIC.apk
          if-no-files-found: error
